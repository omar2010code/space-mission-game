<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazlaoum — adrift in orbit</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 1024 / 572)); aspect-ratio:1024 / 572;
    background:#07070d; overflow:hidden; container-type:inline-size; user-select:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    font-family:Georgia, "Times New Roman", serif; text-align:center; color:#a9a6c8; isolation:isolate; }
  .screen.on { display:flex; }
  .disc { position:absolute; left:50%; top:40%; width:44cqw; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; background:#11121c; z-index:-1; }
  .title { font-size:6.6cqw; color:#f3efe6; letter-spacing:.1cqw; }
  .tagline { font-size:2.6cqw; letter-spacing:.35cqw; color:#b9b6d6; }
  .orn { width:44cqw; height:1px; background:#8a88a8; margin:2.6cqw 0 5cqw; position:relative; }
  .orn i { position:absolute; left:50%; top:50%; width:1.3cqw; height:1.3cqw; transform:translate(-50%,-50%) rotate(45deg);
    border:1px solid #d8d6ee; background:#11121c; outline:.9cqw solid #11121c; }
  .item { font-size:3.1cqw; margin:.7cqw 0; padding:.2cqw 4cqw; position:relative; cursor:pointer; transition:color .15s; white-space:nowrap; }
  .item.sel { color:#fff; text-shadow:0 0 1.4cqw #ffffff66; }
  .item.sel::before, .item.sel::after { content:"◆"; position:absolute; top:50%; transform:translateY(-50%); font-size:1.2cqw; color:#d8d6ee; }
  .item.sel::before { left:1.2cqw; } .item.sel::after { right:1.2cqw; }
  .item b { font-weight:normal; color:#f3efe6; display:inline-block; min-width:5cqw; }
  .foot { position:absolute; bottom:4%; left:0; right:0; font:1.5cqw ui-monospace, Consolas, monospace; color:#5f6386; }
  h2 { font-weight:normal; font-size:4.4cqw; color:#f3efe6; margin:0 0 1cqw; letter-spacing:.3cqw; }
  #hud { position:absolute; left:0; right:0; bottom:2.2%; text-align:center; font:1.35cqw ui-monospace, Consolas, monospace;
    color:#8f93b8; opacity:0; transition:opacity .6s; pointer-events:none; text-shadow:0 0 .4cqw #000; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1024" height="572"></canvas>

  <div class="screen on" id="menu">
    <div class="disc"></div>
    <div class="title">HAZLAOUM</div>
    <div class="tagline">adrift in orbit</div>
    <div class="orn"><i></i></div>
    <div class="item sel" data-act="start">Start game</div>
    <div class="item" data-act="settings">Settings</div>
    <div class="item" data-act="home">Main menu</div>
    <div class="foot">NASA Space Apps 2026 · Space mission design game</div>
  </div>

  <div class="screen" id="settings">
    <div class="disc"></div>
    <h2>Settings</h2>
    <div class="orn" style="margin:1.6cqw 0 3cqw"><i></i></div>
    <div class="item sel" data-act="volume">Volume &nbsp;<span data-step="-1">&nbsp;‹&nbsp;</span><b id="volVal">5</b><span data-step="1">&nbsp;›&nbsp;</span></div>
    <div class="item" data-act="fullscreen">Fullscreen &nbsp;<b id="fsVal">Off</b></div>
    <div class="item" data-act="back">Back</div>
    <div class="foot">↑ ↓ select · ← → change · Enter confirm · Esc back</div>
  </div>

  <div id="hud">WASD / arrow keys to push off · float into a hatch to change room · M for map · Esc for menu</div>
  <div id="fade"></div>
</div>

<script>
const W = 1024, H = 572;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const DEBUG = location.search.includes('debug');

// ---------- assets ----------
const img = src => Object.assign(new Image(), { src: 'assets/' + src });
const POSES = ['idle', 'left', 'right', 'up', 'down', 'tumble'];
const haz = Object.fromEntries(POSES.map(p => [p, img(`haz_${p}.png`)]));

// ---------- rooms ----------
// floor: convex polygon the player must stay inside (clockwise). blocks: solid equipment [x, y, w, h].
// hatches: float into `zone` to travel; you arrive at `spawn` drifting with `vel`.
// map: the room's outline and label position on the ship map (M key).
// The ship is the three rooms built in the workshop, stacked: control room - communication room - life support & shelter.
// lamp: where the room's red emergency lamp is.
const ROOMS = {
  control: {
    name: 'Control Room', sub: 'Room 1 · flight deck', bg: img('room_control.png'), lamp: [803, 176],
    floor: [[300,200],[720,200],[768,216],[838,372],[712,500],[322,500],[192,396],[192,236]],
    blocks: [[340,60,350,150],[380,150,66,74],[580,150,66,74],[186,190,104,196]],
    hatches: [{ zone: [470,452,86,50], to: 'comms', spawn: [512,240], vel: [0,70] }],
    start: [512,330],
    map: { pts: [[462,120],[562,120],[592,160],[592,226],[432,226],[432,160]], label: 'Control Room' },
  },
  comms: {
    name: 'Communication Room', sub: 'Room 2 · radio link to Earth', bg: img('room_comms.png'), lamp: [595, 72],
    floor: [[345,168],[685,168],[808,204],[808,380],[686,514],[340,514],[216,380],[216,204]],
    blocks: [[216,186,126,170],[598,112,112,104],[736,160,74,224]],
    hatches: [{ zone: [470,168,86,34], to: 'control', spawn: [512,400], vel: [0,-70] },
              { zone: [470,452,86,50], to: 'shelter', spawn: [512,250], vel: [0,70] }],
    map: { pts: [[432,232],[592,232],[592,332],[432,332]], label: 'Communication Room' },
  },
  shelter: {
    name: 'Life Support & Shelter', sub: 'Room 3 · radiation shelter', bg: img('room_shelter.png'), lamp: [707, 174],
    floor: [[330,168],[700,168],[794,196],[794,400],[690,478],[346,478],[226,400],[226,196]],
    blocks: [[284,120,172,116],[236,214,164,148],[640,170,156,184],[566,90,124,96],[352,438,46,42],[592,446,76,34]],
    hatches: [{ zone: [470,168,86,34], to: 'comms', spawn: [512,410], vel: [0,-70] }],
    map: { pts: [[432,338],[592,338],[592,438],[432,438]], label: 'Life Support & Shelter' },
  },
};
const visited = new Set();
const flareImg = img('bg_flare.png');
let mapOpen = false;

// ---------- settings + sound ----------
const save = { volume: 5 };
try { Object.assign(save, JSON.parse(localStorage.getItem('hazlaoum') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('hazlaoum', JSON.stringify(save)); } catch (e) {} };

let ac, master;
function audio() {                                   // browsers only allow sound after a key or click
  if (ac) return ac;
  try {
    ac = new AudioContext(); master = ac.createGain(); master.connect(ac.destination); setVolume();
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; lp.connect(master);
    for (const f of [55, 55.7, 82.5]) {              // soft ship hum
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = f; g.gain.value = 0.05; o.connect(g).connect(lp); o.start();
    }
  } catch (e) { ac = null; }
  return ac;
}
function setVolume() { if (master) master.gain.value = save.volume / 10; }
function thump(freq, len, vol) {                     // wall bump / hatch sound
  if (!audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq / 3, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(master); o.start(t); o.stop(t + len);
}

// ---------- state ----------
let state = 'menu';                                  // menu | settings | play
let room = ROOMS.control, roomTitleT = 9;
const P = { x: 512, y: 330, vx: 0, vy: 0, rot: 0, spin: 0, t: 0, pose: 'idle' };
const puffs = [];
const stars = Array.from({ length: 90 }, (_, i) => ({ x: (i * 197.3) % W, y: (i * 89.7 + i * i * 3.1) % H, a: 0.35 + (i % 7) / 10 }));
const drifter = { x: 880, y: 110, vx: -9, vy: 5, rot: 0.3 };
const keys = {};

// ---------- fade (Hollow Knight style: out to black, hold, in) ----------
const fade = { a: 0, dir: 0, hold: 0, mid: null };
function fadeThrough(mid) { if (fade.dir) return; fade.dir = 1; fade.mid = mid; }
function updateFade(dt) {
  if (fade.dir === 1) { fade.a += dt / 0.35; if (fade.a >= 1) { fade.a = 1; fade.dir = 2; fade.hold = 0.28; fade.mid(); } }
  else if (fade.dir === 2) { fade.hold -= dt; if (fade.hold <= 0) fade.dir = -1; }
  else if (fade.dir === -1) { fade.a -= dt / 0.5; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
  $('fade').style.opacity = fade.a;
}

function show(s) {
  state = s;
  $('menu').classList.toggle('on', s === 'menu');
  $('settings').classList.toggle('on', s === 'settings');
  $('hud').style.opacity = s === 'play' ? 1 : 0;
}
function enterRoom(key, spawn, vel) {
  room = ROOMS[key]; roomTitleT = 0; puffs.length = 0; visited.add(key);
  Object.assign(P, { x: spawn[0], y: spawn[1], vx: vel[0], vy: vel[1], rot: 0, spin: 0 });
}

// ---------- menus ----------
const sel = { menu: 0, settings: 0 };
const items = s => [...$(s).querySelectorAll('.item')];
function highlight(s) { items(s).forEach((el, i) => el.classList.toggle('sel', i === sel[s])); }
function refreshSettings() { $('volVal').textContent = save.volume; $('fsVal').textContent = document.fullscreenElement ? 'On' : 'Off'; }
function activate(act, step) {
  audio();
  if (act === 'start') fadeThrough(() => { mapOpen = false; enterRoom('control', ROOMS.control.start, [0, 30]); show('play'); });
  else if (act === 'settings') { sel.settings = 0; highlight('settings'); refreshSettings(); show('settings'); }
  else if (act === 'back') show('menu');
  else if (act === 'home') location.href = '../index.html';
  else if (act === 'volume') {                       // arrows step down/up; Enter or a plain click steps up and wraps 10 -> 0
    save.volume = step ? Math.max(0, Math.min(10, save.volume + step)) : (save.volume + 1) % 11;
    setVolume(); persist(); refreshSettings(); thump(220, 0.12, 0.3);
  }
  else if (act === 'fullscreen' && !step) {
    (document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen()).catch(() => {});
  }
}
document.addEventListener('fullscreenchange', refreshSettings);
for (const s of ['menu', 'settings']) items(s).forEach((el, i) => {
  el.addEventListener('pointerenter', () => { sel[s] = i; highlight(s); });
  el.addEventListener('click', e => {                 // clicking the ‹ or › arrow steps down or up
    sel[s] = i; highlight(s); activate(el.dataset.act, +(e.target.dataset.step || 0));
  });
});

addEventListener('keydown', e => {
  if (ac && ac.state === 'suspended') ac.resume();    // sound started before any key press: wake it up now
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (fade.dir || e.repeat && state !== 'settings') return;
  if (state === 'play') {
    if (story) storyKey(e);
    if (e.code === 'KeyM') mapOpen = !mapOpen;
    else if (e.code === 'Escape') { if (mapOpen) mapOpen = false; else if (story) location.href = '../index.html'; else fadeThrough(() => show('menu')); }
    return;
  }
  const list = items(state), n = list.length, act = list[sel[state]].dataset.act;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') sel[state] = (sel[state] + n - 1) % n;
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') sel[state] = (sel[state] + 1) % n;
  else if (e.code === 'Enter' || e.code === 'Space') activate(act);
  else if (state === 'settings' && (e.code === 'ArrowLeft' || e.code === 'KeyA')) activate(act, -1);
  else if (state === 'settings' && (e.code === 'ArrowRight' || e.code === 'KeyD')) activate(act, 1);
  else if (state === 'settings' && e.code === 'Escape') show('menu');
  highlight(state);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- zero-gravity movement ----------
const R = 17, PUSH = 230, DRAG = 0.35, MAXV = 230, BOUNCE = 0.55;

function hit(nx, ny) {                               // reflect velocity off a surface with normal (nx, ny)
  const vn = P.vx * nx + P.vy * ny;
  if (vn >= 0) return;
  P.vx -= (1 + BOUNCE) * vn * nx; P.vy -= (1 + BOUNCE) * vn * ny;
  if (-vn > 60) {                                    // a real bump sends him tumbling
    P.spin = Math.max(-9, Math.min(9, P.spin + (P.vx * ny - P.vy * nx >= 0 ? 1 : -1) * -vn / 22));
    thump(90, 0.18, Math.min(0.5, -vn / 400));
  }
}

function updatePlayer(dt) {
  const ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const iy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  const il = Math.hypot(ix, iy) || 1, locked = fade.dir !== 0;
  if (!locked && (ix || iy)) {
    P.vx += ix / il * PUSH * dt; P.vy += iy / il * PUSH * dt;
    if (Math.random() < dt * 28) puffs.push({                       // little gas jets, opposite to the push
      x: P.x - ix / il * 16, y: P.y - iy / il * 20, vx: -ix / il * 90 + (Math.random() - 0.5) * 40,
      vy: -iy / il * 90 + (Math.random() - 0.5) * 40, life: 0.45 });
  }
  const k = Math.exp(-DRAG * dt); P.vx *= k; P.vy *= k;             // almost no friction: he keeps gliding
  const sp = Math.hypot(P.vx, P.vy);
  if (sp > MAXV) { P.vx *= MAXV / sp; P.vy *= MAXV / sp; }
  P.x += P.vx * dt; P.y += P.vy * dt; P.t += dt;

  // A few passes so corners between equipment and walls settle; the walls go last so they always win.
  const f = room.floor;
  for (let pass = 0; pass < 3; pass++) {
    for (const [bx, by, bw, bh] of room.blocks) {                   // bounce off equipment
      const cx = Math.max(bx, Math.min(P.x, bx + bw)), cy = Math.max(by, Math.min(P.y, by + bh));
      let dx = P.x - cx, dy = P.y - cy, d = Math.hypot(dx, dy);
      if (d >= R) continue;
      if (d === 0) {                                                // centre got inside: push out the nearest side
        const l = P.x - bx, r = bx + bw - P.x, t = P.y - by, b = by + bh - P.y, m = Math.min(l, r, t, b);
        dx = m === l ? -1 : m === r ? 1 : 0; dy = m === t ? -1 : m === b ? 1 : 0; d = 1;
        P.x += dx * (m + R); P.y += dy * (m + R);
      } else { P.x += dx / d * (R - d); P.y += dy / d * (R - d); }
      hit(dx / d, dy / d);
    }
    for (let i = 0; i < f.length; i++) {                            // stay inside the floor polygon
      const [ax, ay] = f[i], [bx, by] = f[(i + 1) % f.length];
      const ex = bx - ax, ey = by - ay, len = Math.hypot(ex, ey), nx = -ey / len, ny = ex / len;   // inward normal
      const d = (P.x - ax) * nx + (P.y - ay) * ny;
      if (d < R) { P.x += (R - d) * nx; P.y += (R - d) * ny; hit(nx, ny); }
    }
  }

  // body language: lean into the drift, tumble after a bump, settle upright again
  P.spin *= Math.exp(-1.1 * dt); P.rot += P.spin * dt;
  if (Math.abs(P.spin) < 1.2) {
    P.rot = Math.atan2(Math.sin(P.rot), Math.cos(P.rot));
    P.rot += (P.vx / MAXV * 0.45 - P.rot) * Math.min(1, dt * 3);
  }
  const s2 = Math.hypot(P.vx, P.vy);
  P.pose = Math.abs(P.spin) > 1.2 ? 'tumble' : s2 < 22 ? 'idle'
         : Math.abs(P.vx) > Math.abs(P.vy) ? (P.vx < 0 ? 'left' : 'right') : (P.vy < 0 ? 'up' : 'down');

  if (!locked) for (const h of room.hatches) {
    const [zx, zy, zw, zh] = h.zone;
    if (P.x > zx && P.x < zx + zw && P.y > zy && P.y < zy + zh) {
      thump(140, 0.4, 0.35);
      fadeThrough(() => enterRoom(h.to, h.spawn, h.vel));
    }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) puffs.splice(i, 1);
  }
}

// ---------- story: the solar flare ----------
// Arriving with ?story=flare: the ground station has just told Hazalqoum to run to the shelter room.
// phase: run (alarm, countdown) -> flare (it hits) -> dark (power out, red battery lamp) -> end. Or fail if he was too slow.
let story = null;
const FLARE_IN = 40;                                  // seconds until the flare hits
const LINES = [                                       // what is said once the power is out
  ['SHIP', 'Main power lost. Running on the backup battery.'],
  ['HAZALQOUM', 'Everything is dark... only that red lamp on the battery.'],
  ['HAZALQOUM', 'No power. No radio. Nobody can hear me out here.'],
  ['HAZALQOUM', 'Wait. I am not alone on this ship. I have an AI.'],
  ['HAZALQOUM', 'ALKABIR!'],
];
function beep(freq, len, vol, type = 'square') {
  if (!audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + len * 0.8); g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(g).connect(master); o.start(t); o.stop(t + len);
}
function boom() {
  if (!audio()) return;
  const n = ac.sampleRate * 2.5, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = ac.createBufferSource(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
  src.buffer = buf; src.connect(lp).connect(master); src.start();
}
function startStory() {
  story = { phase: 'run', t: 0, left: FLARE_IN, beepT: 0, line: 0, lineT: 0 };
  mapOpen = false; enterRoom('control', ROOMS.control.start, [0, 30]); show('play');
  $('hud').textContent = 'WASD / arrow keys to push off · the shelter is two hatches down · M for map';
  try { localStorage.setItem('hazlaoum.story', 'flare'); } catch (e) {}
}
function updateStory(dt) {
  const st = story; st.t += dt;
  if (st.phase === 'run') {
    st.left -= dt; st.beepT -= dt;
    if (room === ROOMS.shelter && st.left > 4) st.left = 4;        // he made it: the flare arrives moments later
    if (st.beepT <= 0) { st.beepT = st.left < 10 ? 0.45 : 0.9; beep(880, 0.18, 0.12); setTimeout(() => beep(660, 0.18, 0.12), 200); }
    if (st.left <= 0) { st.phase = room === ROOMS.shelter ? 'flare' : 'fail'; st.t = 0; boom(); }
  } else if (st.phase === 'flare' && st.t > 3.2) { st.phase = 'dark'; st.t = 0; st.lineT = 0; thump(60, 1.2, 0.5); $('hud').textContent = 'Enter: continue'; }
  else if (st.phase === 'dark') st.lineT += dt;
}
function storyKey(e) {                                 // Enter / Space: next line, retry, or finish
  if (e.code !== 'Enter' && e.code !== 'Space') return;
  const st = story;
  if (st.phase === 'fail' && st.t > 1.5) fadeThrough(startStory);
  else if (st.phase === 'dark' && st.lineT > 0.4) { st.line++; st.lineT = 0; if (st.line >= LINES.length) { st.phase = 'end'; st.t = 0; } else beep(st.line === LINES.length - 1 ? 520 : 300, 0.08, 0.08, 'sine'); }
  else if (st.phase === 'end' && st.t > 1) location.href = '../index.html';
}
function box(x, y, w, h, col, who, text, small) {       // a message box: radio, ship warning or speech
  ctx.fillStyle = '#0b0c16ee'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.textAlign = 'left'; ctx.fillStyle = col; ctx.font = 'bold 13px ui-monospace, Consolas, monospace'; ctx.fillText(who, x + 14, y + 22);
  ctx.fillStyle = '#f3efe6'; ctx.font = '19px Georgia, serif'; ctx.fillText(text, x + 14, y + 50);
  if (small) { ctx.fillStyle = '#8f93b8'; ctx.font = '12px ui-monospace, Consolas, monospace'; ctx.textAlign = 'right'; ctx.fillText(small, x + w - 12, y + h - 10); }
}
function card(lines, col, hint) {                        // a black title card
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = s.a * 0.6; ctx.fillRect(s.x | 0, s.y | 0, 2, 2); } ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.font = '34px Georgia, serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - (lines.length - 1) * 22 + i * 44));
  if (hint) { ctx.fillStyle = '#8f93b8'; ctx.font = '14px ui-monospace, Consolas, monospace'; ctx.fillText(hint, W / 2, H - 60); }
}
function drawStory() {
  const st = story, [lx, ly] = room.lamp;
  if (st.phase === 'run') {
    const k = 0.5 + 0.5 * Math.sin(st.t * (st.left < 10 ? 12 : 6.5));          // red emergency lights flash with the alarm
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgb(255,${Math.round(70 + 185 * (1 - k))},${Math.round(70 + 185 * (1 - k))})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(lx, ly, 2, lx, ly, 150);
    g.addColorStop(0, `rgba(255,40,40,${0.75 * k})`); g.addColorStop(1, 'rgba(255,40,40,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#3a060cee'; ctx.fillRect(0, 0, W, 44); ctx.fillStyle = '#ff5f6b'; ctx.fillRect(0, 44, W, 2);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffdede'; ctx.font = 'bold 17px ui-monospace, Consolas, monospace';
    ctx.fillText(room === ROOMS.shelter ? 'SHIP WARNING · SOLAR FLARE ARRIVING · BRACE!' : `SHIP WARNING · STRONG SOLAR FLARE INCOMING · ${Math.ceil(st.left)} s`, W / 2, 28);
    if (st.t < 9 && room !== ROOMS.shelter && Math.floor(st.t / 0.35) % 6 !== 5) box(212, 56, 600, 66, '#7fd4ff', 'GROUND STATION', st.t < 4.5 ? 'Attention! Run immediately to the shelter room!' : 'I repeat: run immediately to the shelter room!');
    if (room === ROOMS.shelter) box(262, 56, 500, 66, '#6fe39a', 'HAZALQOUM', 'Made it. The thick walls will stop the radiation.');
  } else if (st.phase === 'flare') {
    const sh = st.t < 2.4 ? 10 : 0;
    if (flareImg.width) ctx.drawImage(flareImg, (Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh, W, H);
    ctx.fillStyle = `rgba(255,250,235,${st.t < 0.5 ? 1 - st.t * 2 : st.t > 2.4 ? Math.min(1, (st.t - 2.4) / 0.4) : 0})`; ctx.fillRect(0, 0, W, H);
    if (st.t > 2.8) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, (st.t - 2.8) / 0.4)})`; ctx.fillRect(0, 0, W, H); }
  } else if (st.phase === 'dark' || st.phase === 'end') {
    const k = 0.6 + 0.4 * Math.sin(st.t * 3), [bx, by] = ROOMS.shelter.lamp, here = room === ROOMS.shelter;
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#ff4a4a'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(bx, by, 10, bx, by, here ? 200 + 30 * k : 1); g.addColorStop(0, 'rgba(3,0,0,0)'); g.addColorStop(1, 'rgba(3,0,0,.95)');
    ctx.fillStyle = here ? g : 'rgba(3,0,0,.95)'; ctx.fillRect(0, 0, W, H);
    if (here) { ctx.globalCompositeOperation = 'lighter'; const r = ctx.createRadialGradient(bx, by, 1, bx, by, 60); r.addColorStop(0, `rgba(255,60,60,${0.9 * k})`); r.addColorStop(1, 'rgba(255,60,60,0)'); ctx.fillStyle = r; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
    ctx.globalAlpha = 0.5; drawHaz(P.x, P.y - 6, P.rot, P.pose, 0.9); ctx.globalAlpha = 1;      // he is a dim shape in the dark
    if (st.phase === 'dark' && st.t > 1.2) { const [who, text] = LINES[st.line]; box(162, 440, 700, 76, who === 'SHIP' ? '#ff5f6b' : '#6fe39a', who, text, 'Enter ▸'); }
    if (st.phase === 'end') { ctx.globalAlpha = Math.min(1, st.t); card(['To be continued...'], '#f3efe6', st.t > 1 ? 'Enter: main menu' : ''); ctx.globalAlpha = 1; }
  } else if (st.phase === 'fail') {
    ctx.fillStyle = `rgba(255,250,235,${Math.max(0, 1 - st.t)})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.min(1, st.t / 1.2); card(['The flare hit before you', 'reached the shelter room.'], '#ff4650', st.t > 1.5 ? 'Enter: try again' : ''); ctx.globalAlpha = 1;
  }
}

// ---------- drawing ----------
function drawHaz(x, y, rot, pose, scale) {
  const im = haz[pose]; if (!im.width) return;
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.drawImage(im, -im.width / 2, -im.height / 2);
  ctx.restore();
}

function drawPlay() {
  ctx.drawImage(room.bg, 0, 0, W, H);
  const bob = Math.sin(P.t * 1.7) * 4;
  ctx.fillStyle = '#00000055';                                      // shadow stays put, far below: he reads as floating
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 46, 15 - bob * 0.4, 5, 0, 0, 7); ctx.fill();
  for (const p of puffs) { ctx.globalAlpha = p.life * 2; ctx.fillStyle = '#e8f4ff'; ctx.fillRect(Math.round(p.x) - 2, Math.round(p.y) - 2, 4, 4); }
  ctx.globalAlpha = 1;
  drawHaz(P.x, P.y + bob - 6, P.rot, P.pose, 0.9);

  if (roomTitleT < 3.2) {                                           // room name fades in and out on arrival
    ctx.globalAlpha = Math.max(0, Math.min(1, roomTitleT / 0.6, (3.2 - roomTitleT) / 0.8));
    ctx.textAlign = 'center'; ctx.fillStyle = '#000c'; ctx.fillRect(0, 248, W, 76);
    ctx.fillStyle = '#f3efe6'; ctx.font = '34px Georgia, serif'; ctx.fillText(room.name, W / 2, 288);
    ctx.fillStyle = '#b9b6d6'; ctx.font = '14px Georgia, serif'; ctx.fillText(room.sub.toUpperCase().split('').join(' '), W / 2, 311);
    ctx.globalAlpha = 1;
  }
  if (DEBUG) {
    ctx.lineWidth = 2; ctx.strokeStyle = '#0f0'; ctx.beginPath(); room.floor.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = '#f33'; room.blocks.forEach(b => ctx.strokeRect(...b));
    ctx.strokeStyle = '#ff0'; room.hatches.forEach(h => ctx.strokeRect(...h.zone));
    ctx.strokeStyle = '#0ff'; ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, 7); ctx.stroke();
  }
}

// Ship map: the three rooms stacked. Rooms you have been in are lit, the one you are in is cyan.
function drawMap() {
  ctx.fillStyle = '#05050bee'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f3efe6'; ctx.font = '32px Georgia, serif'; ctx.fillText('Ship Map', W / 2, 62);
  ctx.fillStyle = '#b9b6d6'; ctx.font = '14px Georgia, serif'; ctx.fillText('T H R E E   R O O M S', W / 2, 88);
  const shape = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  let cur;
  for (const key in ROOMS) {
    const r = ROOMS[key], here = r === room, seen = visited.has(key);
    shape(r.map.pts);
    ctx.fillStyle = here ? '#1d4a63' : seen ? '#232742' : '#12131f'; ctx.fill();
    ctx.strokeStyle = here ? '#7fd4ff' : seen ? '#a9a6c8' : '#3a4060'; ctx.lineWidth = here ? 3 : 2; ctx.stroke();
    const ys = r.map.pts.map(p => p[1]), cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    ctx.strokeStyle = '#3a4060'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(592, cy); ctx.lineTo(640, cy); ctx.stroke();
    ctx.textAlign = 'left'; ctx.fillStyle = here ? '#7fd4ff' : seen ? '#f3efe6' : '#6b6f8f'; ctx.font = '16px Georgia, serif';
    ctx.fillText(seen || story ? r.map.label : '? ? ?', 648, cy + 5);
    if (key === 'shelter' && story && story.phase === 'run') { ctx.fillStyle = '#ff7b85'; ctx.font = '13px ui-monospace, Consolas, monospace'; ctx.fillText('◀ RUN HERE', 648, cy + 26); }
    if (here) cur = [512, cy];
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#f3efe6';                                            // hatches between rooms
  for (const y of [229, 335]) { ctx.beginPath(); ctx.arc(512, y, 5, 0, 7); ctx.fill(); }
  if (cur) drawHaz(cur[0], cur[1] + Math.sin(P.t * 3) * 3, 0, 'idle', 0.55);                      // you are here
  ctx.fillStyle = '#7fd4ff'; ctx.font = '13px ui-monospace, Consolas, monospace';
  ctx.fillText('you are in: ' + room.name, W / 2, 486);
  ctx.fillStyle = '#5f6386'; ctx.fillText('M or Esc to close', W / 2, 526);
}

function drawMenu(dt) {
  ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = s.a; ctx.fillRect(s.x | 0, s.y | 0, 2, 2); }
  ctx.globalAlpha = 1;
  const d = drifter;                                                // Hazlaoum tumbles slowly across the title screen
  d.x += d.vx * dt; d.y += d.vy * dt; d.rot += dt * 0.25;
  if (d.x < -60) d.x = W + 60; if (d.y > H + 60) d.y = -60;
  drawHaz(d.x, d.y, d.rot, 'idle', 1);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  updateFade(dt);
  if (state === 'play') {
    if (mapOpen) { P.t += dt; drawPlay(); drawMap(); }                // the game pauses while the map is open
    else { if (story) updateStory(dt); if (!story || !['flare', 'fail', 'end'].includes(story.phase)) updatePlayer(dt); roomTitleT += dt; drawPlay(); if (story) drawStory(); }
  } else drawMenu(dt);
  requestAnimationFrame(loop);
}
ctx.imageSmoothingEnabled = false;
requestAnimationFrame(loop);
// Arriving from a successful launch in the rocket workshop: skip the title and go straight aboard.
if (new URLSearchParams(location.search).has('from')) activate('start');
if (new URLSearchParams(location.search).get('story') === 'flare') startStory();
</script>
