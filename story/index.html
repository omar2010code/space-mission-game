<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazlaoum — the mission</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16 / 9; background:#000; overflow:hidden; user-select:none; cursor:pointer; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<script>
// The story's cutscenes. ?s=intro (default): the call, then "Engineering Time", then the rocket workshop.
// ?s=launch: lift-off, leaving the atmosphere, the ground station's calls, then inside the ship for the solar flare.
const W = 1280, H = 720, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const img = n => Object.assign(new Image(), { src: `assets/${n}.png` });
const art = { pad: img('bg_pad'), edge: img('bg_edge'), orbiter: img('orbiter'), tank: img('bigtank'), booster: img('booster') };
const params = new URLSearchParams(location.search), saved = (() => { try { return localStorage.getItem('hazlaoum.story'); } catch (e) { return null; } })();
const remember = v => { try { localStorage.setItem('hazlaoum.story', v); } catch (e) {} };
const stars = Array.from({ length: 170 }, (_, i) => [(i * 197.3) % W, (i * 89.7 + i * i * 3.1) % H, 0.25 + (i % 7) / 9, 1 + (i % 3 === 0)]);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), ease = t => t * t * (3 - 2 * t);

// ---------- sound (made in code, no files) ----------
let ac, master, rumbleGain;
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
  try {
    ac = new AudioContext(); master = ac.createGain();
    master.gain.value = (() => { try { const v = JSON.parse(localStorage.getItem('hazlaoum') || '{}').volume; return (v === undefined ? 5 : v) / 10; } catch (e) { return 0.5; } })();   // the volume from Settings
    master.connect(ac.destination);
  } catch (e) { ac = null; }
  return ac;
}
function beep(freq, len, vol, type = 'square', when = 0) {
  if (!audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + len * 0.8); g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(g).connect(master); o.start(t); o.stop(t + len);
}
function rumble(vol) {                                  // engine roar: looping filtered noise
  if (!audio()) return;
  if (!rumbleGain) {
    const n = ac.sampleRate * 2, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    rumbleGain = ac.createGain(); rumbleGain.gain.value = 0; src.buffer = buf; src.loop = true; src.connect(lp).connect(rumbleGain).connect(master); src.start();
  }
  rumbleGain.gain.setTargetAtTime(vol, ac.currentTime, 0.3);
}
function siren(len = 0.8, vol = 0.16) {                  // the warning alarm: a rising "whoop". Built the same simple way as beep(), which is known to play everywhere
  if (!audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'square'; o.frequency.setValueAtTime(330, t); o.frequency.linearRampToValueAtTime(820, t + len * 0.9);
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + len * 0.9); g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(g).connect(master); o.start(t); o.stop(t + len);
}
const radioBeep = () => { beep(1200, 0.07, 0.08, 'sine'); beep(900, 0.07, 0.08, 'sine', 0.09); };

// ---------- drawing helpers ----------
function space(drift = 0) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff';
  for (const [x, y, a, s] of stars) { ctx.globalAlpha = a; ctx.fillRect(x, (y + drift) % H, s, s); } ctx.globalAlpha = 1;
}
function text(lines, col, alpha, size = 40) {
  ctx.globalAlpha = clamp(alpha); ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.font = `${size}px Georgia, "Times New Roman", serif`;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 12 - (lines.length - 1) * size * 0.65 + i * size * 1.3)); ctx.globalAlpha = 1;
}
function hint(t) { ctx.textAlign = 'center'; ctx.fillStyle = '#5f6386'; ctx.font = '15px ui-monospace, Consolas, monospace'; ctx.fillText(t, W / 2, H - 46); }
function box(y, col, who, lines, bg = '#0b0c16ee') {
  const w = 760, h = 50 + lines.length * 30, x = (W - w) / 2;
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.textAlign = 'left'; ctx.fillStyle = col; ctx.font = 'bold 15px ui-monospace, Consolas, monospace'; ctx.fillText(who, x + 18, y + 26);
  ctx.fillStyle = '#f3efe6'; ctx.font = '24px Georgia, serif'; lines.forEach((l, i) => ctx.fillText(l, x + 18, y + 60 + i * 30));
}
function flameAt(x, y, w, k) {
  const f = (30 + Math.random() * 18) * k;
  ctx.fillStyle = '#ff9a2e'; ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y); ctx.lineTo(x, y + f * 2.4); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.moveTo(x - w / 4, y); ctx.lineTo(x + w / 4, y); ctx.lineTo(x, y + f * 1.2); ctx.fill();
}
// The shuttle-style stack with the bottom of the big tank at (cx, bottom), Ht tall.
function stack(cx, bottom, Ht, o) {
  const Wt = Ht * 0.26, Ho = Ht * 0.72, Wo = Ho * 259 / 360, Hb = Ht * 0.88, Wb = Hb * 83 / 360, bx = Wo * 0.36, oB = o.tank ? bottom - Ht * 0.07 : bottom;
  ctx.imageSmoothingEnabled = true;
  if (o.boosters) for (const dir of [-1, 1]) { if (o.flame) flameAt(cx + dir * bx, bottom, Wb * 0.7, Ht / 260); ctx.drawImage(art.booster, cx + dir * bx - Wb / 2, bottom + 4 - Hb, Wb, Hb); }
  if (o.tank) ctx.drawImage(art.tank, cx - Wt / 2, bottom - Ht, Wt, Ht);
  if (o.flame) for (const f of [-0.12, 0, 0.12]) flameAt(cx + f * Wo, oB - 2, Wo * 0.1, Ht / 330);
  ctx.drawImage(art.orbiter, cx - Wo / 2, oB - Ho, Wo, Ho);
  return { Wt, Ht, Hb, Wb, bx };
}

// ---------- scenes ----------
let scene = params.get('s') || (saved ? 'resume' : 'intro'), t = 0, sel = 0, flags = {}, leaving = null;
function goTo(url) { if (leaving) return; leaving = { url, t: 0 }; }
function once(name, fn) { if (!flags[name]) { flags[name] = 1; fn(); } }

const CALL = 'Mr. Hazalqoum, you have been called for a mission of high importance.';
function intro() {                                      // the call, typed out letter by letter; then "Engineering Time"
  space(t * 4);
  const typed = Math.floor(t * 22), done = typed >= CALL.length, t2 = t - (CALL.length / 22 + 2.6);
  if (t2 < 0) {
    const shown = CALL.slice(0, typed), cut = shown.lastIndexOf(' ', 38), lines = shown.length > 38 && cut > 0 ? [shown.slice(0, cut), shown.slice(cut + 1)] : [shown];
    if (!done && typed !== flags.typed) { flags.typed = typed; if (CALL[typed] !== ' ') beep(520 + (typed % 3) * 40, 0.03, 0.04, 'square'); }
    text(lines, '#f3efe6', done ? -t2 / 0.8 : 1);
    if (done && t2 < -1) hint('click or press Enter');
  } else {
    const a = t2 < 1.2 ? t2 / 1.2 : t2 > 3 ? 1 - (t2 - 3) / 1 : 1;       // fade in, hold, fade out
    text(['Engineering Time'], '#f3efe6', a, 56);
    if (t2 > 4.2) { remember('workshop'); goTo('../rocket/index.html?story=1'); }
  }
}
function introSkip() { const end = CALL.length / 22 + 2.6; if (t < CALL.length / 22) t = CALL.length / 22; else if (t < end) t = end; }

const RESUME = { workshop: ['Engineering Time', '../rocket/index.html?story=1'], launch: ['The launch', '?s=launch'], flare: ['The solar flare', '../hazlaoum/index.html?story=flare'], alkabir: ['Waking Alkabir', '../hazlaoum/index.html?story=alkabir'], moon: ['To the Moon', '?s=moon'], rescue: ['The last mission', '../moon/index.html?story=1'] };
function resume() {                                     // a saved story: continue or start again
  space(t * 4);
  const r = RESUME[saved] || RESUME.workshop, items = [`Continue: ${r[0]}`, 'New game', 'Main menu'];
  ctx.textAlign = 'center'; ctx.fillStyle = '#f3efe6'; ctx.font = '54px Georgia, serif'; ctx.fillText('The mission', W / 2, 250);
  items.forEach((it, i) => { ctx.fillStyle = i === sel ? '#fff' : '#8f93b8'; ctx.font = '34px Georgia, serif'; ctx.fillText((i === sel ? '◆  ' : '') + it + (i === sel ? '  ◆' : ''), W / 2, 360 + i * 60); });
  hint('↑ ↓ select · Enter confirm');
}
function resumePick() {
  const r = RESUME[saved] || RESUME.workshop;
  if (sel === 0) { if (r[1].startsWith('?s=')) { scene = r[1].slice(3); t = 0; flags = {}; } else goTo(r[1]); }
  else if (sel === 1) { scene = 'intro'; t = 0; flags = {}; }
  else goTo('../index.html');
}

// The launch. Times in seconds: count-down 0-3, lift-off 3-8, climb through the sky 8-15, edge of space 15-.
const T_LIFT = 3, T_SKY = 8, T_EDGE = 15, T_MECO = 20.5, T_LEFT = 24;   // engines off and tank dropped, then the ground station speaks
const T_CALL = T_LEFT + 8, T_CALL2 = T_CALL + 5, T_WARN = T_CALL2 + 8, T_IN = T_WARN + 6;   // calm, the two calls, a pause, then the alarm
function launch() {
  once('save', () => remember('launch'));
  let shake = 0;
  if (t < T_SKY) {                                      // on the pad, then rising off it
    const k = clamp((t - T_LIFT) / (T_SKY - T_LIFT)), rise = k * k * 900;
    ctx.fillStyle = '#58b4f0'; ctx.fillRect(0, 0, W, H); if (art.pad.width) ctx.drawImage(art.pad, 0, rise, W, H);
    shake = t > T_LIFT - 0.4 ? 4 : 0;
    ctx.save(); ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    stack(640, 620 - rise * 0.35, 430, { tank: 1, boosters: 1, flame: t > T_LIFT - 0.4 });
    if (t > T_LIFT - 0.4) for (let i = 0; i < 14; i++) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#f3efe6'; ctx.beginPath(); ctx.arc(640 + (Math.random() - 0.5) * (200 + k * 500), 640 + rise + Math.random() * 40, 30 + Math.random() * 50, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.restore();
    if (t < T_LIFT) { const n = 3 - Math.floor(t); text([String(n)], '#fff', 1 - (t % 1) * 0.6, 120); once('c' + n, () => beep(440, 0.15, 0.1, 'sine')); }
    else once('go', () => { beep(880, 0.4, 0.1, 'sine'); rumble(0.5); });
  } else if (t < T_EDGE) {                              // the sky darkens from blue to black as the air thins
    const k = clamp((t - T_SKY) / (T_EDGE - T_SKY)), g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgb(${Math.round(88 * (1 - k))},${Math.round(180 * (1 - k))},${Math.round(240 * (1 - k) + 8 * k)})`);
    g.addColorStop(1, `rgb(${Math.round(157 * (1 - k))},${Math.round(223 * (1 - k) + 20 * k)},${Math.round(249 * (1 - k) + 50 * k)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; for (const [x, y, a, s] of stars) { ctx.globalAlpha = a * k * k; ctx.fillRect(x, (y + t * 90) % H, s, s); }
    for (let i = 0; i < 7; i++) { ctx.globalAlpha = 0.5 * (1 - k); ctx.fillStyle = '#fff'; const y = ((i * 173 + t * 900) % (H + 200)) - 100; ctx.beginPath(); ctx.ellipse((i * 331) % W, y, 150, 26, 0, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    const sep = t - 12;                                 // boosters burn out and fall away
    ctx.save(); ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
    const d = stack(640, 500, 330, { tank: 1, boosters: sep < 0, flame: 1 });
    if (sep >= 0) { once('sep', () => beep(160, 0.3, 0.2, 'sawtooth')); for (const dir of [-1, 1]) { ctx.save(); ctx.translate(640 + dir * (d.bx + sep * 90), 500 - d.Hb / 2 + sep * sep * 120); ctx.rotate(dir * sep * 0.7); ctx.drawImage(art.booster, -d.Wb / 2, -d.Hb / 2, d.Wb, d.Hb); ctx.restore(); } }
    ctx.restore();
    if (sep >= 0 && sep < 2.5) box(40, '#8f93b8', 'FLIGHT', ['Booster separation.']);
  } else {                                              // above the air: Earth's curve falls away below
    const k = clamp((t - T_EDGE) / 14), drop = ease(k) * 300;
    space(t * 6);
    if (art.edge.width) { ctx.drawImage(art.edge, 0, drop, W, H); const f = ctx.createLinearGradient(0, drop, 0, drop + 220); f.addColorStop(0, '#000'); f.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = f; ctx.fillRect(0, drop - 1, W, 222); }
    const burning = t < T_MECO, sep = t - T_MECO, y = 470 - ease(clamp((t - T_EDGE) / 6)) * 130, size = 260 - ease(k) * 60;
    if (!burning) once('meco', () => { rumble(0); beep(140, 0.35, 0.2, 'sawtooth'); });
    if (sep >= 0 && sep < 6) { ctx.save(); ctx.translate(640 - sep * 30, y - size / 2 + sep * 70); ctx.rotate(sep * 0.25); const w = size * 0.26; ctx.globalAlpha = clamp(1.5 - sep / 4); ctx.drawImage(art.tank, -w / 2, -size / 2, w, size); ctx.restore(); ctx.globalAlpha = 1; }
    stack(640, y, size, { tank: burning, boosters: 0, flame: burning });
    const say = (from, who, col, line, y = 500) => {            // a radio line, typed out, in the middle of the screen
      const n = Math.floor((t - from) * 30); if (n < line.length && n !== flags.say) { flags.say = n; if (n % 2 === 0) beep(700, 0.02, 0.03, 'sine'); }
      box(y, col, who, [line.slice(0, n)]);
    };
    if (t >= T_LEFT && t < T_CALL - 1) { once('left', radioBeep); say(T_LEFT, 'GROUND STATION', '#7fd4ff', 'You left the Earth atmosphere.'); }
    if (t >= T_CALL && t < T_CALL2) { once('call1', () => { radioBeep(); beep(1200, 0.07, 0.08, 'sine', 0.2); }); say(T_CALL, 'GROUND STATION · URGENT', '#ffcf5a', 'Attention! Run immediately to the shelter room!'); }
    if (t >= T_CALL2 && t < T_CALL2 + 5) { once('call2', () => { radioBeep(); beep(1200, 0.07, 0.08, 'sine', 0.2); }); say(T_CALL2, 'GROUND STATION · URGENT', '#ffcf5a', 'I repeat: run immediately to the shelter room!'); }
    if (t >= T_WARN) {                                  // a few seconds later the ship's own alarm starts
      const c = t - T_WARN, p = 0.5 + 0.5 * Math.sin(c * 7);
      if (Math.floor(c / 1.0) !== flags.al) { flags.al = Math.floor(c / 1.0); siren(0.8); }
      ctx.fillStyle = `rgba(255,20,30,${0.08 + 0.16 * p})`; ctx.fillRect(0, 0, W, H);
      box(60, '#ff5f6b', 'SHIP WARNING', ['Strong solar flare incoming.'], '#3a060cee');
    }
    if (t > T_IN) goTo('../hazlaoum/index.html?story=flare');
  }
}

// To the Moon. The power is back: the ship turns until its nose points at the Moon (0-6 s), fires its engines (6-10 s),
// crosses to the Moon (10-17 s), then lands on its surface (17-25 s). Then the last mission starts.
const M_TURN = 1.5, M_BURN = 6, M_CRUISE = 10, M_LAND = 17, M_DOWN = 23.5, M_GO = 28;
function moonBall(x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); g.addColorStop(0, '#e2e2e6'); g.addColorStop(1, '#8a8c94');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(70,72,82,.35)';
  for (const [dx, dy, s] of [[-0.3, -0.2, 0.22], [0.25, 0.1, 0.15], [-0.05, 0.4, 0.12], [0.4, -0.35, 0.1], [-0.45, 0.25, 0.08]]) { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, s * r, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,10,.5)'; ctx.beginPath(); ctx.arc(x + r * 0.35, y + r * 0.1, r, -1.2, 1.9); ctx.fill();   // night side
}
function ship(x, y, size, ang, flame) {                  // the spacecraft alone, turned to `ang`, centred on (x, y)
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); stack(0, size * 0.72 / 2, size, { tank: 0, boosters: 0, flame }); ctx.restore();
}
function moon() {
  once('save', () => remember('moon'));
  const MX = 1010, MY = 170, aim = Math.atan2(MX - 640, -(MY - 380));          // the angle that points the nose at the Moon
  if (t < M_LAND) {
    const k = clamp((t - M_CRUISE) / (M_LAND - M_CRUISE)), drift = t < M_CRUISE ? t * 6 : M_CRUISE * 6 + (t - M_CRUISE) * 160;
    space(drift);
    const r = 34 + ease(k) * 520, mx = MX + (640 - MX) * ease(k), my = MY + (360 - MY) * ease(k);
    moonBall(mx, my, r);
    const turn = ease(clamp((t - M_TURN) / (M_BURN - M_TURN))), ang = t < M_CRUISE ? aim * turn : aim + (0 - aim) * ease(clamp((t - M_CRUISE) / 3));
    const burning = t >= M_BURN && t < M_CRUISE, size = 230 - ease(k) * 120;
    if (t >= M_TURN && t < M_BURN) {                    // small thruster puffs while it turns
      if (Math.floor(t * 8) !== flags.puff) { flags.puff = Math.floor(t * 8); beep(1800, 0.02, 0.02, 'square'); }
      ctx.fillStyle = 'rgba(230,240,255,.7)'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(640 + d * 60 + Math.random() * 6, 380 - 70 * d + Math.random() * 6, 5, 0, 7); ctx.fill(); }
    }
    if (burning) { once('burn', () => rumble(0.45)); } else if (t >= M_CRUISE) once('cut', () => rumble(0));
    ship(640, 380 - ease(k) * 60, size, ang, burning);
    if (t < M_BURN) box(40, '#6fe39a', 'SHIP', [t < M_TURN ? 'Power restored. All systems online.' : 'Turning toward the Moon...']);
    else if (t < M_CRUISE) box(40, '#6fe39a', 'SHIP', ['Engines firing. Course set for the Moon.']);
    else if (t > M_CRUISE + 1.5) box(40, '#7fd4ff', 'ALKABIR', ['Prepare for landing, little donkey.']);
  } else {                                              // landing: the grey ground below, the ship coming down tail first
    const k = clamp((t - M_LAND) / (M_DOWN - M_LAND)), y = 80 + ease(k) * 470, landed = t >= M_DOWN;
    space(0);
    ctx.fillStyle = '#2b62c4'; ctx.beginPath(); ctx.arc(200, 140, 34, 0, 7); ctx.fill(); ctx.fillStyle = '#3fa35a'; ctx.beginPath(); ctx.arc(190, 130, 13, 0, 7); ctx.fill();   // Earth, far away
    ctx.fillStyle = 'rgba(0,0,10,.55)'; ctx.beginPath(); ctx.arc(214, 140, 34, -1.3, 1.3); ctx.fill();
    const g = ctx.createLinearGradient(0, 560, 0, H); g.addColorStop(0, '#9a9ca4'); g.addColorStop(1, '#55575f'); ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, 590); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 572 + Math.sin(x * 0.013) * 10 + Math.sin(x * 0.041) * 5); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = 'rgba(40,42,52,.35)'; for (const [cx, cw] of [[180, 90], [420, 50], [930, 120], [1150, 60]]) { ctx.beginPath(); ctx.ellipse(cx, 640, cw, cw * 0.18, 0, 0, 7); ctx.fill(); }
    if (!landed) { once('down', () => rumble(0.35)); const dust = clamp((k - 0.7) / 0.3); if (dust > 0) for (let i = 0; i < 16; i++) { ctx.globalAlpha = 0.4 * dust; ctx.fillStyle = '#c9cad0'; ctx.beginPath(); ctx.arc(640 + (Math.random() - 0.5) * 400 * dust, 575 + Math.random() * 20, 20 + Math.random() * 30, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
    else once('touch', () => { rumble(0); beep(90, 0.5, 0.25, 'sawtooth'); });
    stack(640, Math.min(y, 572), 300, { tank: 0, boosters: 0, flame: !landed });
    box(40, landed ? '#6fe39a' : '#7fd4ff', landed ? 'SHIP' : 'ALKABIR', [landed ? 'Touchdown. Welcome to the Moon.' : 'Slowing down... easy... easy...']);
    if (t > M_DOWN + 2.5) text(['The last mission'], '#f3efe6', clamp((t - M_DOWN - 2.5) / 1), 52);
    if (t > M_GO) { remember('rescue'); goTo('../moon/index.html?story=1'); }
  }
}

// The ending. The sample is aboard: count-down on the Moon (0-4.5 s), lift-off in a storm of dust (4.5-11 s),
// up and away as the Moon falls behind and Earth grows (11-20 s), into Earth's glow (20-22 s), then the final card.
const F_IGN = 4.5, F_SPACE = 11, F_HOME = 20, F_CARD = 22;
function earthBall(x, y, r) {
  const g = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.25); g.addColorStop(0, 'rgba(120,180,255,.5)'); g.addColorStop(1, 'rgba(120,180,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.25, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); ctx.fillStyle = '#1f4fa8'; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = '#3f9a55'; for (const [a, b, c] of [[-0.35, -0.2, 0.32], [0.25, 0.3, 0.26], [0.4, -0.35, 0.18], [-0.2, 0.45, 0.15]]) { ctx.beginPath(); ctx.arc(x + a * r, y + b * r, c * r, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.7)'; for (const [a, b, w] of [[-0.25, -0.05, 0.35], [0.2, 0.62, 0.3], [0.35, -0.6, 0.25]]) { ctx.beginPath(); ctx.ellipse(x + a * r, y + b * r, w * r, r * 0.05, 0, 0, 7); ctx.fill(); }   // soft clouds
  ctx.fillStyle = 'rgba(0,0,10,.55)'; ctx.beginPath(); ctx.arc(x + r * 0.6, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function moonGround(dy) {
  const g = ctx.createLinearGradient(0, 560 + dy, 0, H + dy); g.addColorStop(0, '#a3a5ad'); g.addColorStop(1, '#55575f'); ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, 600 + dy); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 582 + dy + Math.sin(x * 0.013) * 10 + Math.sin(x * 0.041) * 5); ctx.lineTo(W, H + 400 + dy); ctx.lineTo(0, H + 400 + dy); ctx.fill();
  ctx.fillStyle = 'rgba(40,42,52,.35)'; for (const [cx, cw] of [[160, 110], [440, 60], [960, 140], [1180, 70]]) { ctx.beginPath(); ctx.ellipse(cx, 660 + dy, cw, cw * 0.18, 0, 0, 7); ctx.fill(); }
}
const STATS = (() => { try { return JSON.parse(sessionStorage.getItem('hazlaoum.finale') || 'null'); } catch (e) { return null; } })();
function finale() {
  once('save', () => { try { localStorage.removeItem('hazlaoum.story'); } catch (e) {} });   // the story is finished: Play starts fresh next time
  if (t < F_SPACE) {                                    // on the Moon
    const k = clamp((t - F_IGN) / (F_SPACE - F_IGN)), rise = k * k * 1100, shake = t > F_IGN - 0.3 && t < F_IGN + 3 ? 9 * (1 - (t - F_IGN) / 3) : 0;
    space(0);
    earthBall(220, 150 + rise * 0.15, 46);
    ctx.save(); ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    moonGround(rise * 0.75);
    const firing = t > F_IGN - 0.3;
    stack(640, 588 + rise * 0.75 - rise, 620, { tank: 0, boosters: 0, flame: firing });
    if (firing) {                                        // a storm of moon dust blasting out sideways
      const d = clamp((t - F_IGN + 0.3) / 1.5) * (1 - clamp((t - F_IGN - 3) / 3));
      for (let i = 0; i < 40; i++) { ctx.globalAlpha = 0.45 * d; ctx.fillStyle = i % 3 ? '#c9cad0' : '#9fa1a8'; const sx = (Math.random() - 0.5) * 1500 * d; ctx.beginPath(); ctx.arc(640 + sx, 590 + rise * 0.75 - Math.abs(sx) * 0.05 + Math.random() * 30, 30 + Math.random() * 60, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (t < F_IGN - 0.5) {
      box(40, '#7fd4ff', 'ALKABIR', [t < 1.5 ? 'Sample secured. Well done, little donkey.' : 'All systems ready. Lift-off in...']);
      if (t > 1.5) { const n = Math.max(1, 3 - Math.floor(t - 1.5)); text([String(n)], '#fff', 1 - ((t - 1.5) % 1) * 0.6, 150); once('c' + n, () => beep(440, 0.15, 0.1, 'sine')); }
    } else {
      once('ign', () => { beep(880, 0.4, 0.1, 'sine'); rumble(0.6); });
      if (t < F_IGN + 3) text(['LIFT-OFF'], '#ffcf5a', 1 - (t - F_IGN) / 3, 120);
    }
  } else if (t < F_CARD) {                               // up and away: the Moon falls behind, Earth grows ahead
    const k = clamp((t - F_SPACE) / (F_HOME - F_SPACE));
    space(t * 40);
    const mr = 900 - ease(k) * 760; moonBall(640, 980 + ease(k) * 40 - (1 - ease(k)) * 0, mr);
    const er = 40 + ease(k) * 360, ex = 640 + (1 - ease(k)) * -280, ey = 120 + ease(k) * 200; earthBall(ex, ey, er);
    const ang = Math.atan2(ex - 640, -(ey - 430)) * clamp((t - F_SPACE) / 3);
    if (t > F_HOME - 2) once('quiet', () => rumble(0.2));
    ctx.save(); ctx.translate(640, 430); ctx.rotate(ang); stack(0, 300 * 0.72 / 2, 300 - ease(k) * 180, { tank: 0, boosters: 0, flame: 1 }); ctx.restore();
    box(40, '#6fe39a', 'SHIP', [k < 0.5 ? 'Leaving the Moon. Course set for Earth.' : 'Earth is getting closer. Going home.']);
    if (t > F_HOME) { ctx.fillStyle = `rgba(200,225,255,${clamp((t - F_HOME) / 2)})`; ctx.fillRect(0, 0, W, H); }
  } else {                                               // the final card
    once('end', () => { rumble(0); beep(520, 0.2, 0.08, 'sine'); beep(660, 0.2, 0.08, 'sine', 0.2); beep(780, 0.4, 0.08, 'sine', 0.4); });
    const a = clamp((t - F_CARD) / 1.2);
    space(t * 3);
    ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffcf5a'; ctx.font = '78px Georgia, serif'; ctx.fillText('Mission accomplished', W / 2, 220);
    ctx.fillStyle = '#f3efe6'; ctx.font = '26px Georgia, serif';
    ['Hazalqoum survived the solar flare, woke Alkabir and brought the ship back to life,',
     'landed on the Moon, recovered the lost rover\'s sample and flew it home.',
     'On Earth, the science team will find out why the rover broke down.'].forEach((l, i) => ctx.fillText(l, W / 2, 320 + i * 40));
    if (STATS) { ctx.fillStyle = '#8f93b8'; ctx.font = '18px ui-monospace, Consolas, monospace'; ctx.fillText(`Moon drive ${STATS.drive} · oxygen left ${STATS.o2}`, W / 2, 490); }
    ctx.globalAlpha = 1;
    if (t > F_CARD + 2) hint('Enter: main menu');
  }
}

function frame(dt) {
  // Browsers keep sound switched off until the player clicks or presses a key on this page. So the scene waits for that.
  if (ac && ac.state !== 'running' && scene !== 'resume') { space(performance.now() / 250); text([scene === 'launch' ? 'Ready for launch' : scene === 'moon' ? 'Course to the Moon' : scene === 'finale' ? 'Lift-off from the Moon' : 'Incoming call'], '#f3efe6', 1, 44); hint('click or press Enter to start'); return; }
  t += dt;
  if (scene === 'intro') intro(); else if (scene === 'resume') resume(); else if (scene === 'moon') moon(); else if (scene === 'finale') finale(); else launch();
  if (leaving) { leaving.t += dt; ctx.fillStyle = `rgba(0,0,0,${clamp(leaving.t / 0.6)})`; ctx.fillRect(0, 0, W, H); if (leaving.t > 0.7 && !leaving.done) { leaving.done = 1; location.href = leaving.url; } }
}
function press() { const waiting = ac && ac.state !== 'running'; audio(); if (waiting) return; if (scene === 'finale' && t > F_CARD + 2) { goTo('../index.html'); return; } if (scene === 'intro') introSkip(); else if (scene === 'resume') resumePick(); }
addEventListener('keydown', e => {
  if (scene === 'resume' && (e.code === 'ArrowUp' || e.code === 'KeyW')) sel = (sel + 2) % 3;
  else if (scene === 'resume' && (e.code === 'ArrowDown' || e.code === 'KeyS')) sel = (sel + 1) % 3;
  else if (e.code === 'Enter' || e.code === 'Space') press();
  else if (e.code === 'Escape') goTo('../index.html');
  else audio();
});
document.getElementById('stage').addEventListener('click', e => {
  if (scene === 'resume') { const y = (e.clientY - cv.getBoundingClientRect().top) / cv.getBoundingClientRect().height * H, i = Math.round((y - 350) / 60); if (i >= 0 && i < 3) sel = i; }
  press();
});
let last = performance.now();
function loop(now) { const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; frame(dt); requestAnimationFrame(loop); }
audio(); requestAnimationFrame(loop);
</script>
</body>
