<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazlaoum — a space mission design game</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16 / 9; background:#07070d; overflow:hidden;
    container-type:inline-size; user-select:none; font-family:Georgia, "Times New Roman", serif; color:#a9a6c8; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; isolation:isolate; }
  .screen.on { display:flex; }
  .disc { position:absolute; left:50%; top:46%; width:50cqw; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:#11121c; z-index:-1; }
  .title { font-size:6.4cqw; color:#f3efe6; letter-spacing:.1cqw; }
  .tagline { font-size:2.3cqw; letter-spacing:.35cqw; color:#b9b6d6; }
  .orn { width:42cqw; height:1px; background:#8a88a8; margin:1.4cqw 0 1.8cqw; position:relative; }
  .orn i { position:absolute; left:50%; top:50%; width:1.2cqw; height:1.2cqw; transform:translate(-50%,-50%) rotate(45deg);
    border:1px solid #d8d6ee; background:#11121c; outline:.8cqw solid #11121c; }
  .item { font-size:2.6cqw; margin:.35cqw 0; padding:.2cqw 4cqw; position:relative; cursor:pointer; white-space:nowrap; }
  .item.sel { color:#fff; text-shadow:0 0 1.4cqw #ffffff66; }
  .item.sel::before, .item.sel::after { content:"◆"; position:absolute; top:50%; transform:translateY(-50%); font-size:1.1cqw; color:#d8d6ee; }
  .item.sel::before { left:1.2cqw; } .item.sel::after { right:1.2cqw; }
  .item small { display:block; font:1.15cqw ui-monospace, Consolas, monospace; color:#6b6f8f; letter-spacing:.05cqw; }
  .item.sel small { color:#8f93b8; }
  h2 { font-weight:normal; font-size:4cqw; color:#f3efe6; margin:0 0 1cqw; }
  .item b { font-weight:normal; color:#f3efe6; display:inline-block; min-width:4cqw; }
  .how { width:60%; text-align:left; font-size:1.6cqw; line-height:1.5; color:#c9c7e4; }
  .how b { color:#f3efe6; font-weight:normal; }
  .how li { margin-bottom:.7cqw; }
  .foot { position:absolute; bottom:4%; left:0; right:0; font:1.4cqw ui-monospace, Consolas, monospace; color:#5f6386; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .4s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div class="screen on" id="menu">
    <div class="disc"></div>
    <div class="title">HAZLAOUM</div>
    <div class="tagline">a space mission design game</div>
    <div class="orn"><i></i></div>
    <div class="item sel" data-go="story/index.html">Single player<small>Mr. Hazalqoum is called for a mission</small></div>
    <div class="item" data-act="multi">Multiplayer<small>coming soon</small></div>
    <div class="item" data-act="settings">Settings</div>
    <div class="foot">↑ ↓ select · Enter confirm · NASA Space Apps 2026</div>
  </div>

  <div class="screen" id="settings">
    <div class="disc"></div>
    <h2>Settings</h2>
    <div class="orn" style="margin:1.4cqw 0 2.4cqw"><i></i></div>
    <div class="item sel" data-act="volume">Volume &nbsp;<span data-step="-1">&nbsp;‹&nbsp;</span><b id="volVal">5</b><span data-step="1">&nbsp;›&nbsp;</span></div>
    <div class="item" data-act="fullscreen">Fullscreen &nbsp;<b id="fsVal">Off</b></div>
    <div class="item" data-act="back">Back</div>
    <div class="foot">↑ ↓ select · ← → change · Enter confirm · Esc back</div>
  </div>
  <div id="fade"></div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), W = 1280, H = 720;
const haz = Object.assign(new Image(), { src: 'hazlaoum/assets/haz_idle.png' });
const stars = Array.from({ length: 140 }, (_, i) => [(i * 197.3) % W, (i * 89.7 + i * i * 3.1) % H, 0.3 + (i % 7) / 10]);
const drifter = { x: 1150, y: 120, vx: -11, vy: 6, rot: 0.3 };

let screen = 'menu';
const sel = { menu: 0, settings: 0 };
// Settings are shared with the rest of the game (the ship and the cutscenes read the same saved volume).
const save = { volume: 5 };
try { Object.assign(save, JSON.parse(localStorage.getItem('hazlaoum') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('hazlaoum', JSON.stringify(save)); } catch (e) {} };
function refreshSettings() { document.getElementById('volVal').textContent = save.volume; document.getElementById('fsVal').textContent = document.fullscreenElement ? 'On' : 'Off'; }
document.addEventListener('fullscreenchange', refreshSettings);
let ac;
function tick() { try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.frequency.value = 660; g.gain.setValueAtTime(0.2 * save.volume / 10, t); g.gain.linearRampToValueAtTime(0, t + 0.12); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.12); } catch (e) {} }
const items = s => [...document.querySelectorAll(`#${s} .item`)];
const highlight = s => items(s).forEach((el, i) => el.classList.toggle('sel', i === sel[s]));
function show(s) { screen = s; document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', el.id === s)); highlight(s); }
function activate(el, step = 0) {
  if (el.dataset.go) { document.getElementById('fade').style.opacity = 1; setTimeout(() => location.href = el.dataset.go, 400); }
  else if (el.dataset.act === 'settings') { sel.settings = 0; refreshSettings(); show('settings'); }
  else if (el.dataset.act === 'volume') { save.volume = step ? Math.max(0, Math.min(10, save.volume + step)) : (save.volume + 1) % 11; persist(); refreshSettings(); tick(); }
  else if (el.dataset.act === 'fullscreen' && !step) (document.fullscreenElement ? document.exitFullscreen() : document.getElementById('stage').requestFullscreen()).catch(() => {});
  else if (el.dataset.act === 'back') show('menu');
}
for (const s of ['menu', 'settings']) items(s).forEach((el, i) => {
  el.addEventListener('pointerenter', () => { sel[s] = i; highlight(s); });
  el.addEventListener('click', e => activate(el, +(e.target.dataset.step || 0)));
});
addEventListener('keydown', e => {
  const list = items(screen), n = list.length;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') sel[screen] = (sel[screen] + n - 1) % n;
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') sel[screen] = (sel[screen] + 1) % n;
  else if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); activate(list[sel[screen]]); return; }
  else if (e.code === 'Escape' && screen === 'settings') { show('menu'); return; }
  else if (screen === 'settings' && (e.code === 'ArrowLeft' || e.code === 'KeyA')) { activate(list[sel[screen]], -1); return; }
  else if (screen === 'settings' && (e.code === 'ArrowRight' || e.code === 'KeyD')) { activate(list[sel[screen]], 1); return; }
  else return;
  e.preventDefault(); highlight(screen);
});
// coming back with the browser's Back button: undo the fade
addEventListener('pageshow', () => document.getElementById('fade').style.opacity = 0);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const [x, y, a] of stars) { ctx.globalAlpha = a; ctx.fillRect(x, y, 2, 2); }
  ctx.globalAlpha = 1;
  const d = drifter;                                   // Hazlaoum tumbles slowly across the title screen
  d.x += d.vx * dt; d.y += d.vy * dt; d.rot += dt * 0.25;
  if (d.x < -80) d.x = W + 80; if (d.y > H + 80) d.y = -80;
  if (haz.width) { ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.drawImage(haz, -haz.width / 2, -haz.height / 2); ctx.restore(); }
  requestAnimationFrame(loop);
}
ctx.imageSmoothingEnabled = false;
requestAnimationFrame(loop);
</script>
</body>
</html>
